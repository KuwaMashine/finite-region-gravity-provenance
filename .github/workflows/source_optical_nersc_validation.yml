name: WALLABY source-only NERSC DR10 photometry validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source_optical_nersc_validation.yml'
      - '.github/scripts/source_optical_nersc_validation.py'

permissions:
  contents: write

jobs:
  nersc-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned optical dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip -q install 'autoprof==1.3.4' astropy --upgrade astro-datalab
      - name: Run NERSC 512 and 1024 photometry validation
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/source_optical_nersc_validation.py
      - name: Commit NERSC validation receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add post-stage0/source-optical-nersc-validation
          if git diff --cached --quiet; then
            echo 'No NERSC validation changes.'
          else
            git commit -m 'Record direct NERSC DR10 photometry validation'
            git pull --rebase origin main
            git push
          fi
