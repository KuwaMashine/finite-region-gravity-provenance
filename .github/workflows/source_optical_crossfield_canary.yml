name: WALLABY source-only cross-field optical canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source_optical_crossfield_canary.yml'
      - '.github/scripts/source_optical_crossfield_canary.py'

permissions:
  contents: write

jobs:
  crossfield-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned source-only optical dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip -q install 'autoprof==1.3.4' astropy --upgrade astro-datalab
          python - <<'PY'
          from importlib.metadata import version
          print('autoprof', version('autoprof'))
          print('astro-datalab', version('astro-datalab'))
          print('astropy', version('astropy'))
          PY
      - name: Run deterministic NGC4808 NGC5044 Vela canaries
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/source_optical_crossfield_canary.py
      - name: Commit cross-field canary receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add post-stage0/source-optical-crossfield-canary
          if git diff --cached --quiet; then
            echo 'No cross-field canary changes.'
          else
            git commit -m 'Record source-only cross-field optical canary'
            git pull --rebase origin main
            git push
          fi
