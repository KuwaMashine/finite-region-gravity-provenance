name: WALLABY final-release source-plane resolver

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source_plane_resolver.yml'
      - '.github/scripts/source_plane_resolver.py'

permissions:
  contents: write

jobs:
  resolve-source-planes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve closed source_data plane candidates
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/source_plane_resolver.py
      - name: Commit source-plane resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add post-stage0/source-plane-resolution
          if git diff --cached --quiet; then
            echo 'No source-plane changes.'
          else
            git commit -m 'Resolve final-release source_data plane spellings'
            git pull --rebase origin main
            git push
          fi
