name: WALLABY source-only H I feasibility audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source_hi_feasibility_audit.yml'
      - '.github/scripts/source_hi_feasibility_audit.py'
      - 'post-stage0/source-plane-resolution/SOURCE_PLANE_RESOLUTION.json'
      - 'post-stage0/frozen-v4.99-source-engine/source_moment0_profile.py'

permissions:
  contents: write

jobs:
  hi-feasibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install source-only H I audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip -q install numpy pandas astropy
      - name: Run deterministic qflag-zero H I feasibility audit
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/source_hi_feasibility_audit.py
      - name: Commit H I feasibility audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add post-stage0/source-hi-feasibility-audit
          if git diff --cached --quiet; then
            echo 'No H I feasibility changes.'
          else
            git commit -m 'Record source-only H I feasibility audit'
            git pull --rebase origin main
            git push
          fi
