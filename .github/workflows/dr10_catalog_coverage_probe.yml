name: WALLABY DR10 catalog coverage probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dr10_catalog_coverage_probe.yml'

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query DR10 tractor counts with documented anonymous client
        shell: bash
        run: |
          set -euo pipefail
          out=post-stage0/dr10-catalog-coverage-probe
          mkdir -p "$out"
          python -m pip -q install --upgrade astro-datalab
          python - <<'PY'
          import csv,re
          from pathlib import Path
          from dl import authClient as ac
          from dl import queryClient as qc
          out=Path('post-stage0/dr10-catalog-coverage-probe')
          token=ac.login('anonymous')
          probes=[
              ('ngc4808_pilot',191.9459810189541,4.33817561380282),
              ('vela_pilot',147.0903045344817,-45.4341811258285),
          ]
          rows=[]
          for label,ra,dec in probes:
              sql=f"SELECT COUNT(*) AS n FROM ls_dr10.tractor_s WHERE q3c_radial_query(ra,dec,{ra},{dec},0.02)"
              body=qc.query(token=token,sql=sql,fmt='csv')
              (out/f'{label}.csv').write_text(body if body.endswith('\n') else body+'\n')
              rr=list(csv.DictReader(body.splitlines()))
              if len(rr)!=1 or 'n' not in rr[0]:
                  raise SystemExit(f'unexpected Data Lab result for {label}: {body!r}')
              s=str(rr[0]['n']).strip()
              if not re.fullmatch(r'\d+',s):
                  raise SystemExit(f'nonnumeric Data Lab count for {label}: {body!r}')
              rows.append((label,ra,dec,int(s)))
          with (out/'counts.csv').open('w',newline='') as f:
              w=csv.writer(f); w.writerow(['label','ra','dec','count']); w.writerows(rows)
          print((out/'counts.csv').read_text())
          PY
          sha256sum "$out"/*.csv > "$out/SHA256SUMS.txt"
      - name: Commit coverage probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add post-stage0/dr10-catalog-coverage-probe
          if git diff --cached --quiet; then echo 'No coverage changes.'; else git commit -m 'Record WALLABY DR10 catalog coverage probe'; git pull --rebase origin main; git push; fi
