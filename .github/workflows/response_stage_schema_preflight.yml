name: WALLABY post-receipt response schema preflight

on:
  push:
    branches: [main]
    paths:
      - 'post-stage0/response-stage-schema-trigger/RUN.json'

permissions:
  contents: write

jobs:
  schema-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Stage-1 receipt exists before response catalogue access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('post-stage0/STAGE1_EXTERNAL_TIMESTAMP_RECEIPT.json').read_text())
          assert r['source_stage_commit']=='23ef651806d1b2c5ea0afd59c54239491869f69e'
          assert r['frozen_manifest_file_sha256']=='61fa4a6f69d93df4616cc0e0ad664797e8cf89c0cd5d6f65a31c0dd695c82a0c'
          assert r['response_products_used_before_receipt'] is False
          assert r['validation_kinematics_opened_before_receipt'] is False
          print('Stage-1 receipt prerequisite: PASS')
          PY
      - name: Query public CADC TAP schema and release metadata only
        run: |
          python - <<'PY'
          import requests, json
          from pathlib import Path
          endpoint='https://ws-uv.canfar.net/youcat/sync'
          table='cirada.Wallaby_dr2_kinematic_catalogue'
          def query(q):
              r=requests.post(endpoint,data={'REQUEST':'doQuery','LANG':'ADQL','FORMAT':'csv','QUERY':q},timeout=120)
              r.raise_for_status(); return r.content
          out=Path('post-stage0/response-stage-schema-preflight'); out.mkdir(parents=True,exist_ok=True)
          q1=("SELECT column_name, datatype, arraysize, unit, description "
              "FROM TAP_SCHEMA.columns WHERE table_name='"+table+"' ORDER BY column_index")
          (out/'tap_schema.csv').write_bytes(query(q1))
          q2=("SELECT team_release, team_release_kin, COUNT(*) AS n_rows "
              "FROM "+table+" GROUP BY team_release, team_release_kin "
              "ORDER BY team_release, team_release_kin")
          (out/'release_metadata.csv').write_bytes(query(q2))
          meta={'schema':'WALLABY_RESPONSE_SCHEMA_PREFLIGHT_v2','endpoint':endpoint,'table':table,
                'query_kind':'TAP_SCHEMA plus distinct/grouped release metadata only; no Rad, Vrot_model, QFlag_model or other response values loaded',
                'stage1_receipt_verified':True,'response_values_loaded':False}
          (out/'SCHEMA_PREFLIGHT.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit schema metadata receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add post-stage0/response-stage-schema-preflight
          git commit -m 'Record post-receipt kinematic release metadata' || exit 0
          git pull --rebase origin main
          git push
