name: WALLABY source-data artifact metadata probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source_product_probe.yml'

permissions:
  contents: write

jobs:
  probe-source-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query CADC CAOM2 source-data metadata only
        shell: bash
        run: |
          set -euo pipefail
          out=post-stage0/source-product-probe
          mkdir -p "$out"
          tap='https://ws.cadc-ccda.hia-iha.nrc-cnrc.gc.ca/argus/sync'
          adql="SELECT o.observationID,p.productID,p.planeURI,a.uri,a.productType,a.contentType,a.contentLength,a.contentChecksum FROM caom2.Observation AS o JOIN caom2.Plane AS p ON o.obsID=p.obsID JOIN caom2.Artifact AS a ON p.planeID=a.planeID WHERE o.collection='WALLABY' AND o.observationID='WALLABY_J101655-485238' AND p.productID LIKE 'source_data_%'"
          curl -fSs -X POST "$tap" \
            --data-urlencode 'REQUEST=doQuery' \
            --data-urlencode 'LANG=ADQL' \
            --data-urlencode 'FORMAT=csv' \
            --data-urlencode "QUERY=$adql" \
            -o "$out/source_artifacts_one_object.csv"
          if grep -Eqi 'kinematic|kinmodel|rotcur|model_data|Vrot' "$out/source_artifacts_one_object.csv"; then
            echo 'Source-data artifact firewall violation' >&2
            exit 1
          fi
          sha256sum "$out/source_artifacts_one_object.csv" > "$out/SHA256SUMS.txt"
          cat > "$out/PROBE_SCOPE.txt" <<'EOF'
          Post-Stage-0 metadata-only probe for one source-safe Vela object already exposed by the allow-listed source catalogue.
          CAOM2 query is constrained to collection=WALLABY and productID LIKE source_data_%.
          No kinematic plane is queried.
          Purpose: recover public source-product artifact URI/filename conventions for moment-map acquisition.
          EOF
      - name: Commit probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add post-stage0/source-product-probe
          if git diff --cached --quiet; then
            echo 'No probe changes.'
          else
            git commit -m 'Record WALLABY source-data artifact metadata probe'
            git push
          fi
