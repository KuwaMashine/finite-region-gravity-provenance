name: WALLABY source-data artifact metadata probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source_product_probe.yml'

permissions:
  contents: write

jobs:
  probe-source-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query CADC CAOM2 source-data metadata only
        shell: bash
        run: |
          set -euo pipefail
          out=post-stage0/source-product-probe
          mkdir -p "$out"
          tap='https://ws.cadc-ccda.hia-iha.nrc-cnrc.gc.ca/argus/sync'
          q1="SELECT TOP 20 o.observationID,p.productID,p.planeURI FROM caom2.Observation AS o JOIN caom2.Plane AS p ON o.obsID=p.obsID WHERE o.collection='WALLABY' AND p.productID='source_data_Vela_TR1'"
          q2="SELECT o.observationID,p.productID,p.planeURI,a.uri,a.productType,a.contentType,a.contentLength,a.contentChecksum FROM caom2.Observation AS o JOIN caom2.Plane AS p ON o.obsID=p.obsID JOIN caom2.Artifact AS a ON p.planeID=a.planeID WHERE o.collection='WALLABY' AND o.observationID='WALLABY_J094821-452603' AND p.productID='source_data_Vela_TR1'"
          for spec in "vela_planes:$q1" "known_source_artifacts:$q2"; do
            name=${spec%%:*}; query=${spec#*:}
            curl -fSsL -X POST "$tap" \
              --data-urlencode 'REQUEST=doQuery' \
              --data-urlencode 'LANG=ADQL' \
              --data-urlencode 'RESPONSEFORMAT=csv' \
              --data-urlencode "QUERY=$query" \
              -o "$out/${name}.csv"
            test -s "$out/${name}.csv" || { echo "empty TAP response: $name" >&2; exit 1; }
          done
          if grep -Eqi 'kinematic|kinmodel|rotcur|model_data|Vrot' "$out/known_source_artifacts.csv"; then
            echo 'Source-data artifact firewall violation' >&2
            exit 1
          fi
          sha256sum "$out/vela_planes.csv" "$out/known_source_artifacts.csv" > "$out/SHA256SUMS.txt"
          cat > "$out/PROBE_SCOPE.txt" <<'EOF'
          Post-Stage-0 metadata-only CADC CAOM2 probe.
          Queries are constrained to collection=WALLABY and the source_data_Vela_TR1 plane only.
          The known source observation is taken from CADC's public source-data CAOM2 example.
          No kinematic plane or kinematic catalogue is queried.
          CADC TAP redirects are followed and zero-byte responses fail closed.
          Purpose: recover source-product artifact URI/filename conventions for moment-map acquisition.
          EOF
      - name: Commit probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add post-stage0/source-product-probe
          if git diff --cached --quiet; then
            echo 'No probe changes.'
          else
            git commit -m 'Resolve CADC source-data TAP transport'
            git push
          fi
