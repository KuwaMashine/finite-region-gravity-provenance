name: WALLABY source-data artifact metadata probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source_product_probe.yml'

permissions:
  contents: write

jobs:
  probe-source-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose CADC CAOM2 source-data metadata route
        shell: bash
        run: |
          set -euo pipefail
          out=post-stage0/source-product-probe
          mkdir -p "$out"
          tap='https://ws.cadc-ccda.hia-iha.nrc-cnrc.gc.ca/argus/sync'
          q0="SELECT TOP 5 o.observationID FROM caom2.Observation AS o WHERE o.collection='WALLABY'"
          q1="SELECT TOP 20 o.observationID,p.productID FROM caom2.Observation AS o JOIN caom2.Plane AS p ON o.obsID=p.obsID WHERE o.collection='WALLABY' AND p.productID='source_data_Vela_TR1'"
          q2="SELECT TOP 20 o.observationID,p.productID,a.uri FROM caom2.Observation AS o JOIN caom2.Plane AS p ON o.obsID=p.obsID JOIN caom2.Artifact AS a ON p.planeID=a.planeID WHERE o.collection='WALLABY' AND o.observationID='WALLABY_J094821-452603' AND p.productID='source_data_Vela_TR1'"
          : > "$out/http_status.txt"
          for spec in "observations:$q0" "vela_planes:$q1" "known_source_artifacts:$q2"; do
            name=${spec%%:*}; query=${spec#*:}
            code=$(curl -SsL -X POST "$tap" \
              --data-urlencode 'REQUEST=doQuery' \
              --data-urlencode 'LANG=ADQL' \
              --data-urlencode 'FORMAT=csv' \
              --data-urlencode "QUERY=$query" \
              -o "$out/${name}.response" -w '%{http_code}')
            printf '%s %s\n' "$name" "$code" >> "$out/http_status.txt"
          done
          cat > "$out/PROBE_SCOPE.txt" <<'EOF'
          Post-Stage-0 metadata-only CADC CAOM2 diagnostic.
          Queries are built incrementally: Observation only, then source-data Plane, then source-data Artifact.
          No kinematic plane or kinematic catalogue is queried.
          Error bodies and HTTP status are retained so archive syntax failures cannot masquerade as empty data.
          EOF
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add post-stage0/source-product-probe
          if git diff --cached --quiet; then
            echo 'No diagnostic changes.'
          else
            git commit -m 'Diagnose CADC CAOM2 source-data route'
            git push
          fi
