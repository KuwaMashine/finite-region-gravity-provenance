name: WALLABY source-only cross-field optical canary v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source_optical_crossfield_canary_v2.yml'
      - '.github/scripts/source_optical_crossfield_canary_v2.py'

permissions:
  contents: write

jobs:
  crossfield-canary-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned source-only optical dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip -q install 'autoprof==1.3.4' astropy --upgrade astro-datalab
      - name: Run 1024-pixel containment-guarded field canaries
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/source_optical_crossfield_canary_v2.py
      - name: Commit v2 cross-field canary receipts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add post-stage0/source-optical-crossfield-canary-v2
          if git diff --cached --quiet; then
            echo 'No v2 canary changes.'
          else
            git commit -m 'Record containment-guarded source-only cross-field canary v2'
            git pull --rebase origin main
            git push
          fi
