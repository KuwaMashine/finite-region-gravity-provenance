name: WALLABY frozen kappa lock audit

on:
  push:
    branches: [main]
    paths:
      - 'post-stage0/blind-kappa-lock-trigger/RUN.json'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audit dependency
        run: python -m pip -q install numpy pandas
      - name: Audit source-only kappa identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np, pandas as pd
          root=Path.cwd()
          p=pd.read_csv(root/'post-stage0/source-stage1-target/source_predictors.csv',usecols=['galaxy_id','R_HI90','R_dstar','kappa_HI'],dtype={'galaxy_id':str})
          s=pd.read_csv(root/'post-stage0/source-stage1-target/proxy_strata.csv',usecols=['galaxy_id','kappa_HI','stratum'],dtype={'galaxy_id':str})
          z=p.merge(s,on='galaxy_id',suffixes=('_pred','_sealed'),validate='one_to_one')
          a=z.kappa_HI_pred.to_numpy(float); b=z.kappa_HI_sealed.to_numpy(float)
          geom=z.R_HI90.to_numpy(float)/z.R_dstar.to_numpy(float)
          finite=np.isfinite(a)&np.isfinite(b)&np.isfinite(geom)
          d_pred=np.abs(a[finite]-b[finite]); d_geom=np.abs(geom[finite]-b[finite])
          rep={
            'schema':'WALLABY_KAPPA_LOCK_AUDIT_v2','source_only':True,'response_values_loaded':False,
            'n_joined':int(len(z)),'n_finite':int(finite.sum()),
            'predictor_vs_sealed_max_abs_diff':float(d_pred.max()),
            'predictor_vs_sealed_n_gt_1e10':int((d_pred>1e-10).sum()),
            'serialized_geometry_vs_sealed_max_abs_diff':float(d_geom.max()),
            'serialized_geometry_vs_sealed_n_gt_1e10':int((d_geom>1e-10).sum()),
            'serialized_geometry_vs_sealed_n_gt_1e9':int((d_geom>1e-9).sum()),
            'serialized_geometry_vs_sealed_n_gt_2e9':int((d_geom>2e-9).sum()),
            'allclose_geometry_at_1e9':bool(np.allclose(geom,b,rtol=0,atol=1e-9)),
            'allclose_geometry_at_2e9':bool(np.allclose(geom,b,rtol=0,atol=2e-9)),
            'writer_basis':'freeze_proxy_strata.py reads serialized R_HI90/R_dstar, recomputes ratio, then writes kappa_HI with %.12g'
          }
          out=root/'post-stage0/blind-kappa-lock'; out.mkdir(parents=True,exist_ok=True)
          (out/'AUDIT.json').write_text(json.dumps(rep,indent=2,sort_keys=True)+'\n')
          print(json.dumps(rep,sort_keys=True))
          PY
      - name: Commit source-only lock audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add post-stage0/blind-kappa-lock/AUDIT.json
          git commit -m 'Refine frozen source kappa serialization audit' || exit 0
          git pull --rebase origin main
          git push
