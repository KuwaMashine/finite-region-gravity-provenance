name: WALLABY source-only AutoProf optical pilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source_optical_autoprof_pilot.yml'

permissions:
  contents: write

jobs:
  autoprof-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Acquire source-only pilot and DR10 grz cube
        shell: bash
        run: |
          set -euo pipefail
          tmp=/tmp/wallaby_autoprof_pilot
          out=post-stage0/source-optical-autoprof-pilot
          rm -rf "$tmp"
          mkdir -p "$tmp" "$out"
          tap='https://ws-uv.canfar.net/youcat/sync'
          curl -fSsG "$tap" \
            --data-urlencode 'REQUEST=doQuery' \
            --data-urlencode 'LANG=ADQL' \
            --data-urlencode 'FORMAT=csv' \
            --data-urlencode "QUERY=SELECT name,ra,dec,dist_h,ell_maj,ell_min,ell_pa,log_m_hi_corr,rel,qflag,team_release FROM cirada.Wallaby_dr2_source_catalogue WHERE name='WALLABY J124947+035042' AND team_release='NGC 4808 TR1'" \
            -o "$tmp/source.csv"
          python - "$tmp/source.csv" "$tmp/coords.txt" <<'PY'
          import csv,sys
          rr=list(csv.DictReader(open(sys.argv[1],encoding='utf-8')))
          if len(rr)!=1: raise SystemExit(f'expected one source row, got {len(rr)}')
          r=rr[0]; nbeam=float(r['ell_maj'])/5.0
          if float(r['qflag']) != 0: raise SystemExit('pilot qflag != 0')
          if nbeam < 2.0: raise SystemExit(f'pilot not primary-lane resolved: {nbeam}')
          open(sys.argv[2],'w').write(f"{r['ra']} {r['dec']}\n")
          print(f"pilot={r['name']} nbeam={nbeam:.6f}")
          PY
          read ra dec < "$tmp/coords.txt"
          cut="https://www.legacysurvey.org/viewer/cutout.fits?ra=${ra}&dec=${dec}&layer=ls-dr10&pixscale=0.262&bands=grz&size=512"
          code=$(curl -SsL "$cut" -o "$tmp/dr10_grz.fits" -w '%{http_code}')
          test "$code" = 200 || { echo "DR10 cutout HTTP $code"; head -c 1000 "$tmp/dr10_grz.fits" || true; exit 1; }
      - name: Run pinned AutoProf on r band
        shell: bash
        run: |
          set -euo pipefail
          tmp=/tmp/wallaby_autoprof_pilot
          out="$GITHUB_WORKSPACE/post-stage0/source-optical-autoprof-pilot"
          python -m pip -q install 'autoprof==1.3.4' astropy
          python - <<'PY'
          from pathlib import Path
          from astropy.io import fits
          import numpy as np
          tmp=Path('/tmp/wallaby_autoprof_pilot')
          with fits.open(tmp/'dr10_grz.fits',memmap=False) as h:
              data=np.asarray(h[0].data)
              bands=str(h[0].header.get('BANDS',''))
              if data.ndim != 3 or bands != 'grz' or data.shape[0] != 3:
                  raise SystemExit(f'unexpected DR10 cube: shape={data.shape}, BANDS={bands!r}')
              r=data[1].astype('float32')
          if not np.isfinite(r).all(): raise SystemExit('non-finite r-band pixels')
          fits.PrimaryHDU(r).writeto(tmp/'pilot_r.fits',overwrite=True)
          PY
          mkdir -p "$tmp/run"
          cat > "$tmp/run/config.py" <<'PY'
          ap_process_mode = 'image'
          ap_image_file = '/tmp/wallaby_autoprof_pilot/pilot_r.fits'
          ap_name = 'wallaby_j124947_035042_r'
          ap_pixscale = 0.262
          ap_zeropoint = 22.5
          ap_doplot = False
          ap_isoclip = True
          PY
          cd "$tmp/run"
          autoprof config.py
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          from importlib.metadata import version
          run=Path('/tmp/wallaby_autoprof_pilot/run')
          out=Path(__import__('os').environ['GITHUB_WORKSPACE'])/'post-stage0/source-optical-autoprof-pilot'
          prof=sorted(run.glob('*.prof')); aux=sorted(run.glob('*.aux')); logs=sorted(run.glob('*.log'))
          if len(prof)!=1: raise SystemExit(f'expected exactly one .prof, got {[p.name for p in prof]}')
          if len(aux)!=1: raise SystemExit(f'expected exactly one .aux, got {[p.name for p in aux]}')
          shutil.copy2(prof[0],out/'pilot_r.prof')
          shutil.copy2(aux[0],out/'pilot_r.aux')
          if logs: shutil.copy2(logs[0],out/'pilot_r.log')
          summary={
            'scope':'source-only DR10 r-band AutoProf structural pilot; no validation kinematics queried',
            'autoprof_version':version('autoprof'),
            'pixscale_arcsec':0.262,
            'zeropoint_nanomaggies':22.5,
            'band':'r',
            'profile_file':'pilot_r.prof','aux_file':'pilot_r.aux',
            'n_profile_lines':sum(1 for _ in (out/'pilot_r.prof').open()),
          }
          (out/'autoprof_pilot_summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY
          cd "$GITHUB_WORKSPACE"
          sha256sum "$out"/pilot_r.prof "$out"/pilot_r.aux "$out"/autoprof_pilot_summary.json > "$out/SHA256SUMS.txt"
      - name: Commit AutoProf pilot outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add post-stage0/source-optical-autoprof-pilot
          if git diff --cached --quiet; then echo 'No AutoProf pilot changes.'; else git commit -m 'Record source-only AutoProf r-band pilot'; git pull --rebase origin main; git push; fi
